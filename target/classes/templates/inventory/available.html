<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(
        pageTitle='Available Units',
        content=~{::content}
      )}">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="content">

    <!-- Page Header -->
    <div th:replace="~{layout/components :: pageHeader(
        title='Available Blood Units',
        description='Active, non-expired blood units sorted by earliest expiration date first (FEFO).',
        actionUrl=@{/inventory},
        actionText='Stock Summary',
        actionIcon='arrow-left'
    )}"></div>

    <!-- Filter Bar -->
    <div class="bg-white p-4 rounded-xl border border-stone-200 shadow-sm mb-6 flex items-center justify-between flex-wrap gap-4">
        <form th:action="@{/inventory/available}" method="get" class="flex items-center gap-3">
            <label class="text-xs font-semibold text-stone-500 uppercase tracking-wider">Filter Blood Group:</label>
            <select name="bloodGroup" onchange="this.form.submit()"
                    class="px-3 py-1.5 text-sm text-stone-900 bg-stone-50 border border-stone-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition-colors">
                <option value="ALL" th:selected="${selectedBloodGroup == 'ALL'}">All Groups</option>
                <option th:each="bg : ${bloodGroups}" 
                        th:value="${bg}" 
                        th:text="${bg}" 
                        th:selected="${selectedBloodGroup == bg}">A+</option>
            </select>
            <a th:if="${selectedBloodGroup != null and selectedBloodGroup != 'ALL'}" 
               th:href="@{/inventory/available}" 
               class="text-xs text-stone-500 hover:text-stone-900 underline">Reset</a>
        </form>

        <div class="text-xs text-stone-500 flex items-center">
            <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span>
            <span th:text="${units.size() + ' units available in inventory'}">0 units available</span>
        </div>
    </div>

    <!-- Units Table Card -->
    <div class="bg-white rounded-xl border border-stone-200 shadow-sm overflow-hidden">
        
        <div class="overflow-x-auto" th:if="${!units.isEmpty()}">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-stone-200 bg-stone-50/75 text-[11px] font-semibold text-stone-500 uppercase tracking-wider">
                        <th class="py-3 px-4">Unit ID</th>
                        <th class="py-3 px-4">Donation Ref</th>
                        <th class="py-3 px-4">Blood Group</th>
                        <th class="py-3 px-4">Product Type</th>
                        <th class="py-3 px-4">Collection Date</th>
                        <th class="py-3 px-4">Expiry Date</th>
                        <th class="py-3 px-4">Days Left (FEFO)</th>
                        <th class="py-3 px-4 text-right">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-stone-100 text-sm text-stone-700">
                    <tr th:each="unit : ${units}" class="hover:bg-stone-50/75 transition-colors">
                        <td class="py-3.5 px-4 font-mono text-xs font-semibold text-stone-900" th:text="${'#U-' + unit.unitId}">#U-101</td>
                        <td class="py-3.5 px-4 font-mono text-xs text-stone-500" th:text="${'#DN-' + unit.donationId}">#DN-1</td>
                        <td class="py-3.5 px-4">
                            <span th:replace="~{layout/components :: bloodGroupChip(group=${unit.bloodGroup})}">A+</span>
                        </td>
                        <td class="py-3.5 px-4 text-stone-600 text-xs" th:text="${unit.productType}">WHOLE_BLOOD</td>
                        <td class="py-3.5 px-4 font-mono text-xs text-stone-600" th:text="${#temporals.format(unit.collectionDate, 'yyyy-MM-dd')}">2026-02-01</td>
                        <td class="py-3.5 px-4 font-mono text-xs text-stone-900 font-semibold" th:text="${#temporals.format(unit.expiryDate, 'yyyy-MM-dd')}">2026-03-04</td>
                        <td class="py-3.5 px-4">
                            <span th:if="${unit.expiringSoon}" 
                                  class="inline-flex items-center text-xs font-semibold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-full border border-amber-200">
                                <i data-lucide="alert-triangle" class="w-3.5 h-3.5 mr-1 text-amber-600"></i>
                                <span th:text="${unit.daysLeft + ' day(s) left'}">4 days left</span>
                            </span>
                            <span th:unless="${unit.expiringSoon}" 
                                  class="inline-flex items-center text-xs font-medium text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                                <span th:text="${unit.daysLeft + ' days left'}">25 days left</span>
                            </span>
                        </td>
                        <td class="py-3.5 px-4 text-right">
                            <span th:replace="~{layout/components :: statusBadge(status=${unit.status})}">AVAILABLE</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div th:if="${units.isEmpty()}" class="p-8">
            <div th:replace="~{layout/components :: emptyState(
                icon='droplet',
                title='No available blood units',
                message='No active, non-expired units match this blood group in inventory. Record new donations to replenish supply.',
                actionUrl=@{/donations/new},
                actionText='Record New Donation'
            )}"></div>
        </div>

    </div>

</div>

</body>
</html>
