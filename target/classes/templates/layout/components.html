<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Blood Group Chip -->
<span th:fragment="bloodGroupChip(group)" 
      class="inline-flex items-center justify-center px-2.5 py-0.5 text-xs font-semibold rounded-full bg-red-50 text-red-700 border border-red-200"
      th:text="${group}">A+</span>

<!-- Priority Badge -->
<span th:fragment="priorityBadge(priority)"
      th:class="${priority == 'EMERGENCY' ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-800 border border-red-300 animate-pulse' : 
                 (priority == 'URGENT' ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300' : 
                 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-stone-100 text-stone-700 border border-stone-200')}"
      th:text="${priority}">NORMAL</span>

<!-- Status Badge -->
<span th:fragment="statusBadge(status)"
      th:class="${status == 'AVAILABLE' || status == 'FULFILLED' ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200' :
                 (status == 'PENDING' ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200' :
                 (status == 'EXPIRED' ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-50 text-red-700 border border-red-200' :
                 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200'))}"
      th:text="${status}">AVAILABLE</span>

<!-- Flash Messages -->
<div th:fragment="flashMessages" class="mb-6 space-y-3">
    <!-- Success Message -->
    <div th:if="${successMessage}" class="flex items-center p-4 text-sm text-emerald-800 rounded-xl bg-emerald-50 border border-emerald-200 shadow-sm transition-all" role="alert">
        <i data-lucide="check-circle-2" class="w-5 h-5 mr-3 text-emerald-600 shrink-0"></i>
        <div class="font-medium" th:text="${successMessage}">Operation completed successfully.</div>
    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="flex items-center p-4 text-sm text-red-800 rounded-xl bg-red-50 border border-red-200 shadow-sm transition-all" role="alert">
        <i data-lucide="alert-circle" class="w-5 h-5 mr-3 text-red-600 shrink-0"></i>
        <div class="font-medium" th:text="${errorMessage}">An error occurred.</div>
    </div>

    <!-- Warning Message -->
    <div th:if="${warningMessage}" class="flex items-center p-4 text-sm text-amber-800 rounded-xl bg-amber-50 border border-amber-200 shadow-sm transition-all" role="alert">
        <i data-lucide="alert-triangle" class="w-5 h-5 mr-3 text-amber-600 shrink-0"></i>
        <div class="font-medium" th:text="${warningMessage}">Warning message.</div>
    </div>

    <!-- Info Message -->
    <div th:if="${infoMessage}" class="flex items-center p-4 text-sm text-stone-800 rounded-xl bg-stone-100 border border-stone-200 shadow-sm transition-all" role="alert">
        <i data-lucide="info" class="w-5 h-5 mr-3 text-stone-600 shrink-0"></i>
        <div class="font-medium" th:text="${infoMessage}">Information notice.</div>
    </div>
</div>

<!-- Page Header Fragment -->
<div th:fragment="pageHeader(title, description, actionUrl, actionText, actionIcon)" 
     class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-6 mb-6 border-b border-stone-200 gap-4">
    <div>
        <h1 class="text-2xl font-bold tracking-tight text-stone-900" th:text="${title}">Page Title</h1>
        <p class="text-sm text-stone-500 mt-1" th:text="${description}">Brief description of the current view.</p>
    </div>
    <div th:if="${actionUrl != null}">
        <a th:href="${actionUrl}" 
           class="inline-flex items-center justify-center px-4 py-2.5 text-sm font-medium text-white bg-red-700 hover:bg-red-800 active:bg-red-900 rounded-xl shadow-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
            <i th:if="${actionIcon}" th:data-lucide="${actionIcon}" class="w-4 h-4 mr-2"></i>
            <span th:text="${actionText}">New Action</span>
        </a>
    </div>
</div>

<!-- Empty State Fragment -->
<div th:fragment="emptyState(icon, title, message, actionUrl, actionText)" 
     class="text-center py-12 px-6 bg-white rounded-xl border border-dashed border-stone-300">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-stone-100 text-stone-500 mb-4">
        <i th:data-lucide="${icon != null ? icon : 'inbox'}" class="w-6 h-6"></i>
    </div>
    <h3 class="text-base font-semibold text-stone-900" th:text="${title}">No records found</h3>
    <p class="mt-1 text-sm text-stone-500 max-w-sm mx-auto" th:text="${message}">There are currently no items to display in this list.</p>
    <div th:if="${actionUrl != null}" class="mt-5">
        <a th:href="${actionUrl}" 
           class="inline-flex items-center px-3.5 py-2 text-sm font-medium text-red-700 bg-red-50 hover:bg-red-100 rounded-lg transition-colors border border-red-200">
            <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i>
            <span th:text="${actionText}">Add New</span>
        </a>
    </div>
</div>

<!-- Pagination Fragment -->
<nav th:fragment="pagination(currentPage, totalPages, queryParams)" 
     th:if="${totalPages > 1}" 
     class="flex items-center justify-between px-4 py-3 bg-white border-t border-stone-200 sm:px-6 rounded-b-xl" 
     aria-label="Pagination">
    <div class="hidden sm:block">
        <p class="text-sm text-stone-600">
            Page <span class="font-semibold text-stone-900" th:text="${currentPage}">1</span> of 
            <span class="font-semibold text-stone-900" th:text="${totalPages}">1</span>
        </p>
    </div>
    <div class="flex items-center space-x-2">
        <a th:if="${currentPage > 1}" 
           th:href="@{''(page=${currentPage - 1}, bloodGroup=${param.bloodGroup}, search=${param.search}, priority=${param.priority})}"
           class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-stone-700 bg-white border border-stone-300 rounded-lg hover:bg-stone-50">
            <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Previous
        </a>
        <span th:unless="${currentPage > 1}" 
              class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-stone-400 bg-stone-50 border border-stone-200 rounded-lg cursor-not-allowed">
            <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Previous
        </span>

        <a th:if="${currentPage < totalPages}" 
           th:href="@{''(page=${currentPage + 1}, bloodGroup=${param.bloodGroup}, search=${param.search}, priority=${param.priority})}"
           class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-stone-700 bg-white border border-stone-300 rounded-lg hover:bg-stone-50">
            Next <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>
        </a>
        <span th:unless="${currentPage < totalPages}" 
              class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-stone-400 bg-stone-50 border border-stone-200 rounded-lg cursor-not-allowed">
            Next <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>
        </span>
    </div>
</nav>

</body>
</html>
