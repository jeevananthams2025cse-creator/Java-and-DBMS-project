<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(
        pageTitle='Register Donor',
        content=~{::content}
      )}">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="content">

    <!-- Page Header -->
    <div th:replace="~{layout/components :: pageHeader(
        title='Register New Donor',
        description='Enroll an eligible voluntary blood donor into the central registry.',
        actionUrl=@{/donors},
        actionText='Back to Donors',
        actionIcon='arrow-left'
    )}"></div>

    <!-- Form Container -->
    <div class="max-w-2xl bg-white rounded-xl border border-stone-200 shadow-sm p-6 sm:p-8">
        
        <form th:action="@{/donors}" th:object="${donorForm}" method="post" class="space-y-6">
            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Full Name -->
            <div>
                <label for="name" class="block text-xs font-semibold text-stone-700 uppercase tracking-wider mb-1.5">
                    Full Legal Name <span class="text-red-600">*</span>
                </label>
                <div class="relative rounded-xl shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <input type="text" id="name" th:field="*{name}" 
                           placeholder="e.g. Johnathan Doe" 
                           class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-stone-900 bg-stone-50 border border-stone-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition-colors placeholder:text-stone-400">
                </div>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1.5 text-xs text-red-600 font-medium flex items-center">
                    <i data-lucide="alert-circle" class="w-3.5 h-3.5 mr-1"></i> Full name error
                </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <!-- Age -->
                <div>
                    <label for="age" class="block text-xs font-semibold text-stone-700 uppercase tracking-wider mb-1.5">
                        Age (Years) <span class="text-red-600">*</span>
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
                            <i data-lucide="calendar" class="w-4 h-4"></i>
                        </div>
                        <input type="number" id="age" th:field="*{age}" min="18" max="65" 
                               placeholder="18 - 65" 
                               class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-stone-900 bg-stone-50 border border-stone-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition-colors placeholder:text-stone-400">
                    </div>
                    <p class="text-[11px] text-stone-400 mt-1">Eligible range: 18 - 65 years</p>
                    <p th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="mt-1.5 text-xs text-red-600 font-medium flex items-center">
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5 mr-1"></i> Age error
                    </p>
                </div>

                <!-- Blood Group -->
                <div>
                    <label for="bloodGroup" class="block text-xs font-semibold text-stone-700 uppercase tracking-wider mb-1.5">
                        Blood Group <span class="text-red-600">*</span>
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
                            <i data-lucide="droplet" class="w-4 h-4"></i>
                        </div>
                        <select id="bloodGroup" th:field="*{bloodGroup}" 
                                class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-stone-900 bg-stone-50 border border-stone-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition-colors">
                            <option value="">-- Select Blood Group --</option>
                            <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg}">A+</option>
                        </select>
                    </div>
                    <p th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}" class="mt-1.5 text-xs text-red-600 font-medium flex items-center">
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5 mr-1"></i> Blood group error
                    </p>
                </div>
            </div>

            <!-- Phone -->
            <div>
                <label for="phone" class="block text-xs font-semibold text-stone-700 uppercase tracking-wider mb-1.5">
                    Contact Phone Number <span class="text-red-600">*</span>
                </label>
                <div class="relative rounded-xl shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
                        <i data-lucide="phone" class="w-4 h-4"></i>
                    </div>
                    <input type="text" id="phone" th:field="*{phone}" 
                           placeholder="+1 (555) 000-0000" 
                           class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-stone-900 bg-stone-50 border border-stone-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition-colors placeholder:text-stone-400">
                </div>
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="mt-1.5 text-xs text-red-600 font-medium flex items-center">
                    <i data-lucide="alert-circle" class="w-3.5 h-3.5 mr-1"></i> Phone error
                </p>
            </div>

            <!-- Last Donation Date -->
            <div>
                <label for="lastDonationDate" class="block text-xs font-semibold text-stone-700 uppercase tracking-wider mb-1.5">
                    Last Known Donation Date (Optional)
                </label>
                <div class="relative rounded-xl shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
                        <i data-lucide="calendar-clock" class="w-4 h-4"></i>
                    </div>
                    <input type="date" id="lastDonationDate" th:field="*{lastDonationDate}" 
                           class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-stone-900 bg-stone-50 border border-stone-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition-colors">
                </div>
                <p class="text-[11px] text-stone-400 mt-1">Leave blank if this is the donor's first time donating.</p>
                <p th:if="${#fields.hasErrors('lastDonationDate')}" th:errors="*{lastDonationDate}" class="mt-1.5 text-xs text-red-600 font-medium flex items-center">
                    <i data-lucide="alert-circle" class="w-3.5 h-3.5 mr-1"></i> Date error
                </p>
            </div>

            <!-- Submit Buttons -->
            <div class="pt-4 border-t border-stone-200 flex items-center justify-end space-x-3">
                <a th:href="@{/donors}" 
                   class="px-4 py-2 text-sm font-medium text-stone-700 bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors">
                    Cancel
                </a>
                <button type="submit" 
                        class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-semibold text-white bg-red-700 hover:bg-red-800 active:bg-red-900 rounded-xl shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-red-600 focus:ring-offset-2">
                    <i data-lucide="check" class="w-4 h-4 mr-2"></i> Register Donor
                </button>
            </div>
        </form>

    </div>

</div>

</body>
</html>
