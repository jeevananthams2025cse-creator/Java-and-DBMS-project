<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Uthiram Blood Bank</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#FAFAF9',
                        crimson: {
                            700: '#B91C1C',
                            800: '#991B1B',
                            900: '#7F1D1D'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        'xl': '12px',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #FAFAF9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased bg-[#FAFAF9]">

    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-white rounded-xl border border-stone-200 shadow-sm p-8 sm:p-10">
            <!-- Brand Logo & Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-red-700 text-white shadow-sm mb-4">
                    <i data-lucide="droplets" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-stone-900">Uthiram</h1>
                <p class="text-xs font-medium text-stone-400 uppercase tracking-widest mt-1">Blood Bank Management</p>
                <p class="text-sm text-stone-500 mt-2">Sign in to your administrative account</p>
            </div>

            <!-- Error Alerts -->
            <div th:if="${errorMessage}" class="mb-5 flex items-center p-3.5 text-xs text-red-800 rounded-xl bg-red-50 border border-red-200">
                <i data-lucide="alert-circle" class="w-4 h-4 mr-2.5 text-red-600 shrink-0"></i>
                <span th:text="${errorMessage}">Invalid email or password.</span>
            </div>

            <div th:if="${infoMessage}" class="mb-5 flex items-center p-3.5 text-xs text-emerald-800 rounded-xl bg-emerald-50 border border-emerald-200">
                <i data-lucide="check-circle-2" class="w-4 h-4 mr-2.5 text-emerald-600 shrink-0"></i>
                <span th:text="${infoMessage}">You have been logged out successfully.</span>
            </div>

            <div th:if="${warningMessage}" class="mb-5 flex items-center p-3.5 text-xs text-amber-800 rounded-xl bg-amber-50 border border-amber-200">
                <i data-lucide="alert-triangle" class="w-4 h-4 mr-2.5 text-amber-600 shrink-0"></i>
                <span th:text="${warningMessage}">Your session has expired.</span>
            </div>

            <!-- Form -->
            <form th:action="@{/login}" method="post" class="space-y-5">
                <!-- CSRF Token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-stone-700 mb-1.5 uppercase tracking-wider">Email Address</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input type="email" id="email" name="email" required autofocus
                               placeholder="admin@bloodbank.com"
                               class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-stone-900 bg-white border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition-colors placeholder:text-stone-400">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-stone-700 mb-1.5 uppercase tracking-wider">Password</label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" id="password" name="password" required
                               placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                               class="block w-full pl-10 pr-10 py-2.5 text-sm text-stone-900 bg-white border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 transition-colors placeholder:text-stone-400">
                        <button type="button" id="toggle-password-btn" 
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-stone-400 hover:text-stone-600 focus:outline-none"
                                title="Toggle password visibility">
                            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        class="w-full mt-2 inline-flex items-center justify-center px-4 py-2.5 text-sm font-semibold text-white bg-red-700 hover:bg-red-800 active:bg-red-900 rounded-xl shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-red-600 focus:ring-offset-2">
                    <i data-lucide="log-in" class="w-4 h-4 mr-2"></i>
                    Sign In
                </button>
            </form>
        </div>

        <!-- Minimal Sub-Footer -->
        <p class="text-center text-xs text-stone-400 mt-6">
            Authorized Personnel Only &bull; Secured with BCrypt
        </p>
    </div>

    <!-- Toggle Password Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();

            const toggleBtn = document.getElementById('toggle-password-btn');
            const passwordInput = document.getElementById('password');

            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    
                    // Re-render icon
                    toggleBtn.innerHTML = isPassword 
                        ? '<i data-lucide="eye-off" class="w-4 h-4"></i>'
                        : '<i data-lucide="eye" class="w-4 h-4"></i>';
                    lucide.createIcons();
                });
            }
        });
    </script>
</body>
</html>
