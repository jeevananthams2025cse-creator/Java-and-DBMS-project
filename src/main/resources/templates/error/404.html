<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(
        pageTitle='Page Not Found',
        content=~{::content}
      )}">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="content" class="py-12">
    <div class="max-w-md mx-auto text-center bg-white p-8 rounded-xl border border-stone-200 shadow-sm">
        <div class="w-14 h-14 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-4 border border-amber-200">
            <i data-lucide="compass" class="w-7 h-7"></i>
        </div>
        <h1 class="text-xl font-bold text-stone-900">Page Not Found</h1>
        <p class="text-sm text-stone-500 mt-2">
            The page you requested is either not available or is scheduled for the upcoming development phase.
        </p>
        <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-3">
            <a th:href="@{/dashboard}" 
               class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-2 text-sm font-semibold text-white bg-red-700 hover:bg-red-800 rounded-xl transition-colors">
                <i data-lucide="layout-dashboard" class="w-4 h-4 mr-2"></i> Return to Dashboard
            </a>
            <a href="javascript:history.back()" 
               class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-stone-700 bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Go Back
            </a>
        </div>
    </div>
</div>

</body>
</html>
