<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(
        pageTitle='Blood Requests',
        content=~{::content}
      )}">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="content">

    <!-- Page Header -->
    <div th:replace="~{layout/components :: pageHeader(
        title='Blood Requests',
        description='Clinical requests from hospitals, prioritized by emergency severity with FEFO matching.',
        actionUrl=@{/requests/new},
        actionText='New Blood Request',
        actionIcon='plus'
    )}"></div>

    <!-- Navigation Tabs Bar -->
    <div class="border-b border-stone-200 mb-6">
        <nav class="flex space-x-6">
            <a th:href="@{/requests(tab='ALL')}" 
               th:class="${activeTab == 'ALL' ? 'py-3 px-1 border-b-2 border-red-700 font-semibold text-sm text-red-700 flex items-center' : 'py-3 px-1 border-b-2 border-transparent font-medium text-sm text-stone-500 hover:text-stone-700 hover:border-stone-300 flex items-center'}">
                All Orders
                <span class="ml-2 py-0.5 px-2 rounded-full text-xs font-semibold bg-stone-100 text-stone-600" th:text="${allCount}">0</span>
            </a>
            <a th:href="@{/requests(tab='PENDING')}" 
               th:class="${activeTab == 'PENDING' ? 'py-3 px-1 border-b-2 border-red-700 font-semibold text-sm text-red-700 flex items-center' : 'py-3 px-1 border-b-2 border-transparent font-medium text-sm text-stone-500 hover:text-stone-700 hover:border-stone-300 flex items-center'}">
                Pending
                <span class="ml-2 py-0.5 px-2 rounded-full text-xs font-semibold bg-amber-100 text-amber-800" th:text="${pendingCount}">0</span>
            </a>
            <a th:href="@{/requests(tab='EMERGENCY')}" 
               th:class="${activeTab == 'EMERGENCY' ? 'py-3 px-1 border-b-2 border-red-700 font-semibold text-sm text-red-700 flex items-center' : 'py-3 px-1 border-b-2 border-transparent font-medium text-sm text-stone-500 hover:text-stone-700 hover:border-stone-300 flex items-center'}">
                <i data-lucide="alert-octagon" class="w-3.5 h-3.5 mr-1 text-red-600"></i>
                Emergency
                <span class="ml-2 py-0.5 px-2 rounded-full text-xs font-semibold bg-red-100 text-red-800" th:text="${emergencyCount}">0</span>
            </a>
            <a th:href="@{/requests(tab='FULFILLED')}" 
               th:class="${activeTab == 'FULFILLED' ? 'py-3 px-1 border-b-2 border-red-700 font-semibold text-sm text-red-700 flex items-center' : 'py-3 px-1 border-b-2 border-transparent font-medium text-sm text-stone-500 hover:text-stone-700 hover:border-stone-300 flex items-center'}">
                Fulfilled
                <span class="ml-2 py-0.5 px-2 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800" th:text="${fulfilledCount}">0</span>
            </a>
        </nav>
    </div>

    <!-- Data Table Card -->
    <div class="bg-white rounded-xl border border-stone-200 shadow-sm overflow-hidden">
        
        <div class="overflow-x-auto" th:if="${!requests.isEmpty()}">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-stone-200 bg-stone-50/75 text-[11px] font-semibold text-stone-500 uppercase tracking-wider">
                        <th class="py-3 px-4">Order ID</th>
                        <th class="py-3 px-4">Patient & Hospital</th>
                        <th class="py-3 px-4">Required Group</th>
                        <th class="py-3 px-4">Units</th>
                        <th class="py-3 px-4">Priority</th>
                        <th class="py-3 px-4">Status</th>
                        <th class="py-3 px-4">Requested At</th>
                        <th class="py-3 px-4 text-right">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-stone-100 text-sm text-stone-700">
                    <tr th:each="req : ${requests}" 
                        th:class="${req.priority == 'EMERGENCY' and req.status == 'PENDING' ? 'bg-red-50/30 hover:bg-red-50/50 transition-colors' : 'hover:bg-stone-50/75 transition-colors'}">
                        <td class="py-3.5 px-4 font-mono text-xs font-semibold text-stone-900" th:text="${'#REQ-' + req.requestId}">#REQ-1</td>
                        <td class="py-3.5 px-4">
                            <span class="font-semibold text-stone-900 block" th:text="${req.patientName}">Jane Doe</span>
                            <span class="text-xs text-stone-500 flex items-center">
                                <i data-lucide="building-2" class="w-3 h-3 mr-1 text-stone-400"></i>
                                <span th:text="${req.hospital}">St. Jude Hospital</span>
                            </span>
                        </td>
                        <td class="py-3.5 px-4">
                            <span th:replace="~{layout/components :: bloodGroupChip(group=${req.bloodGroup})}">B+</span>
                        </td>
                        <td class="py-3.5 px-4 font-semibold text-stone-900" th:text="${req.unitsRequired + ' unit(s)'}">2 units</td>
                        <td class="py-3.5 px-4">
                            <span th:replace="~{layout/components :: priorityBadge(priority=${req.priority})}">NORMAL</span>
                        </td>
                        <td class="py-3.5 px-4">
                            <span th:replace="~{layout/components :: statusBadge(status=${req.status})}">PENDING</span>
                        </td>
                        <td class="py-3.5 px-4 font-mono text-xs text-stone-500" th:text="${#temporals.format(req.requestDate, 'yyyy-MM-dd HH:mm')}">2026-02-01 10:30</td>
                        <td class="py-3.5 px-4 text-right">
                            <a th:if="${req.status == 'PENDING'}" 
                               th:href="@{/requests/{id}/fulfil(id=${req.requestId})}" 
                               th:class="${req.priority == 'EMERGENCY' ? 'inline-flex items-center text-xs font-semibold text-white bg-red-700 hover:bg-red-800 px-3 py-1.5 rounded-lg shadow-sm transition-colors' : 'inline-flex items-center text-xs font-semibold text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-200 transition-colors'}">
                                <i data-lucide="check-circle-2" class="w-3.5 h-3.5 mr-1"></i> Fulfil Order
                            </a>
                            <a th:if="${req.status == 'FULFILLED'}" 
                               th:href="@{/issues}" 
                               class="inline-flex items-center text-xs font-medium text-stone-600 hover:text-stone-900 bg-stone-100 hover:bg-stone-200 px-2.5 py-1 rounded-lg transition-colors">
                                <i data-lucide="history" class="w-3.5 h-3.5 mr-1"></i> View Issue Log
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div th:if="${requests.isEmpty()}" class="p-8">
            <div th:replace="~{layout/components :: emptyState(
                icon='clipboard-list',
                title='No requests in this category',
                message='No blood requests match this filter tab. Create a new request whenever hospitals place orders.',
                actionUrl=@{/requests/new},
                actionText='Create New Request'
            )}"></div>
        </div>

        <!-- Pagination -->
        <div th:replace="~{layout/components :: pagination(
            currentPage=${currentPage},
            totalPages=${totalPages},
            queryParams=''
        )}"></div>

    </div>

</div>

</body>
</html>
